# ---------------------------------------------------------------------------
# TradeKaro — nginx site config (Linux VPS)
#
#   sudo cp deploy/nginx-tradekaro-locations.conf /etc/nginx/snippets/tradekaro-locations.conf
#   sudo sed "s/YOUR_DOMAIN/example.com/g" deploy/nginx-tradekaro.conf \
#        > /etc/nginx/sites-available/tradekaro
#   sudo ln -sf /etc/nginx/sites-available/tradekaro /etc/nginx/sites-enabled/tradekaro
#   sudo nginx -t && sudo systemctl reload nginx
#
# `deploy/enable-tls.sh` does all of that plus the certificate. Install this
# file only AFTER the certificate exists: the 443 block names the cert files,
# and nginx refuses to start if they are missing.
#
# Replace YOUR_DOMAIN below (cert paths only — both blocks stay default_server
# so the bare IP keeps working as a fallback).
# ---------------------------------------------------------------------------

upstream tradekaro_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- The real client IP ------------------------------------------------------
#
# Cloudflare proxies every visitor, so the TCP peer nginx sees is always a
# Cloudflare edge — which is what the logs used to record, making them useless
# for telling a bot from a customer. The visitor's actual address is only in
# CF-Connecting-IP.
#
# A `map` rather than nginx's `realip` module, and that is the load-bearing
# choice. `real_ip_header` rewrites $remote_addr, and the access module then
# checks the REWRITTEN address — so an allow-list built on it would trust a
# header the caller supplies, and anyone could reach the origin by sending
# "CF-Connecting-IP: 104.16.0.1". Keeping $remote_addr as the true peer is
# what makes the origin lock in the locations snippet mean anything.
#
# The header is only believed when the peer is genuinely Cloudflare. Without
# that test a direct request could put any address it liked in the first log
# field — and logs are exactly what an operator reads to decide who to block,
# so a forgeable one is worse than none. `$tk_edge` comes from the generated
# geo list; when it is 0 the real peer is logged instead.
#
# The WHOLE geo block lives in that generated file, and it is included here
# with a wildcard. nginx does not expand a wildcard for an include nested
# INSIDE a geo block — it fails with "open() ... No such file or directory"
# naming the literal star — but it expands one at http level without
# complaint. Hence the indirection.
include /etc/nginx/snippets/cloudflare-geo.conf*;

map "$tk_edge:$http_cf_connecting_ip" $tk_client_ip {
    default   $remote_addr;
    "~^1:."   $http_cf_connecting_ip;
}

log_format tk_combined '$tk_client_ip - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'via=$tk_edge peer=$remote_addr';

# --- Port 80 -----------------------------------------------------------------
# Stays the default_server so http://<server-ip> still reaches the app. That
# matters because it is the only way in if DNS or the certificate breaks.
#
# NOTE: with the origin lock installed that fallback is closed — the bare IP
# is refused like any other non-Cloudflare client. The way in is SSH:
#   ssh -L 8080:127.0.0.1:3000 root@<ip>   then browse http://localhost:8080
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log tk_combined;

    # KYC documents and any future uploads. There is no file upload today, so
    # this only guards against absurd request bodies.
    client_max_body_size 2m;

    # ACME HTTP-01, served from disk so a renewal still succeeds while the Node
    # app is restarting. Harmless when certificates come from DNS-01 or a
    # Cloudflare Origin cert instead, and it keeps the http-01 option open.
    #
    # Deliberately NOT behind the origin lock. Let's Encrypt validates from its
    # own servers, which are not Cloudflare, so locking this path would break
    # every renewal 30 days later — the kind of failure that has no symptom
    # until the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/tradekaro-locations.conf;
}

# --- Port 443 ----------------------------------------------------------------
# Cloudflare terminates TLS for visitors and re-encrypts to this listener, so
# this cert is what Cloudflare sees. `Full (strict)` mode requires it to be
# valid — a self-signed placeholder only survives `Full`.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    access_log /var/log/nginx/access.log tk_combined;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # TLS 1.2 floor: Cloudflare and every current browser manage better, and
    # anything older cannot do modern ciphers anyway.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    include /etc/nginx/snippets/tradekaro-locations.conf;
}
