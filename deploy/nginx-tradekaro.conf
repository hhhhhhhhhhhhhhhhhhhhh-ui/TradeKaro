# ---------------------------------------------------------------------------
# TradeKaro — nginx site config (Linux VPS)
#
#   sudo cp deploy/nginx-tradekaro.conf /etc/nginx/sites-available/tradekaro
#   sudo ln -s /etc/nginx/sites-available/tradekaro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every YOUR_DOMAIN below before installing. The HTTPS server block is
# appended by `certbot --nginx`; run it after the domain resolves to this box.
# ---------------------------------------------------------------------------

upstream tradekaro_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # KYC documents and any future uploads. There is no file upload today, so
    # this only guards against absurd request bodies.
    client_max_body_size 2m;

    # --- Server-sent events ---------------------------------------------------
    # Quotes stream over SSE on this path. Buffering it is the classic mistake:
    # nginx holds the bytes, the browser sees nothing, and the price feed looks
    # dead while the server is fine. `proxy_read_timeout` also has to exceed the
    # gap between ticks or nginx severs an idle-but-healthy stream.
    location /api/market/stream {
        proxy_pass http://tradekaro_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Everything else ------------------------------------------------------
    location / {
        proxy_pass http://tradekaro_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app records this in the audit log and on rejected orders.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Next.js fingerprints everything under /_next/static, so it is safe to
    # cache hard and keep it off the Node process entirely.
    location /_next/static/ {
        proxy_pass http://tradekaro_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
