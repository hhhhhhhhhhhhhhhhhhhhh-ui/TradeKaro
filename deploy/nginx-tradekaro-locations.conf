# ---------------------------------------------------------------------------
# TradeKaro — nginx locations shared by the HTTP and HTTPS server blocks.
#
#   installed to /etc/nginx/snippets/tradekaro-locations.conf
#
# Split out on purpose: the SSE block below is the one piece of proxy config
# that must be byte-identical on both listeners. Duplicating it is how you end
# up with a working price feed over HTTP and a dead one over HTTPS.
#
# THE ORIGIN LOCK LIVES IN THESE LOCATIONS, NOT ON THE SERVER BLOCK.
#
# `allow`/`deny` are evaluated top to bottom and the server-level list is
# checked BEFORE the location's, so a `deny all` on the server would refuse a
# request that a location then tries to allow — nginx never gets that far. The
# ACME path in the site config is the one thing that must stay reachable from
# outside Cloudflare, so the lock is applied to the proxying locations only
# and that path is left alone.
#
# The include carries a trailing `*`: nginx fails to start on a missing
# literal include but ignores a wildcard with no matches, which is what makes
# `rm` a valid rollback.
#
# --- Server-sent events ----------------------------------------------------
# Quotes stream over SSE on this path. Buffering it is the classic mistake:
# nginx holds the bytes, the browser sees nothing, and the price feed looks
# dead while the server is fine. `proxy_read_timeout` also has to exceed the
# gap between ticks or nginx severs an idle-but-healthy stream.
location /api/market/stream {
    include /etc/nginx/snippets/cloudflare-only.conf*;

    proxy_pass http://tradekaro_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tk_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# --- Everything else -------------------------------------------------------
location / {
    include /etc/nginx/snippets/cloudflare-only.conf*;

    proxy_pass http://tradekaro_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The real visitor, from $tk_client_ip — not $remote_addr, which is only
    # ever a Cloudflare edge.
    proxy_set_header X-Real-IP $tk_client_ip;
    # The app records this in the audit log and on rejected orders.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The app decides whether to mark session cookies Secure from this header,
    # not from NODE_ENV. Behind Cloudflare it must stay $scheme so an HTTPS
    # visitor gets an HTTPS-only cookie and a plain-HTTP one still can log in.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
}

# Next.js fingerprints everything under /_next/static, so it is safe to cache
# hard and keep it off the Node process entirely.
location /_next/static/ {
    include /etc/nginx/snippets/cloudflare-only.conf*;

    proxy_pass http://tradekaro_app;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
}
