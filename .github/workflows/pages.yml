# Publishes the standalone marketing page in sales/ to GitHub Pages.
#
# sales/ is a self-contained static site (index.html + shots/), so the whole
# folder is uploaded as the Pages artifact and becomes the site root -- which
# keeps the page's relative `shots/...` image paths working.
#
# If Pages has not been switched on for this repo yet, open
# Settings -> Pages -> Build and deployment -> Source and choose
# "GitHub Actions". The `enablement: true` below also asks the action to turn it
# on automatically.
name: Deploy sales page

on:
  push:
    branches: [main]
    paths:
      - "sales/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sales

      - id: deployment
        uses: actions/deploy-pages@v4
